# Umbral: la app (SPA) y la API bajo el mismo dominio.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Adjuntos del chat: hasta ~30 MB en base64 (ver backend/app/esquemas.py).
    client_max_body_size 40m;

    # Encabezados de seguridad. Van en un archivo aparte e incluidos en CADA
    # location que agrega sus propios encabezados: en nginx, un add_header
    # dentro de un location anula TODOS los heredados del server.
    include /etc/nginx/snippets/seguridad.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La IP que vio nginx (sobrescribe cualquier X-Real-IP del cliente).
        proxy_set_header X-Real-IP $remote_addr;
        # Cloudflare manda la IP real en este encabezado. El backend solo le
        # cree con CONFIAR_CLOUDFLARE=true, que exige que nginx no sea
        # alcanzable sin pasar por Cloudflare (ENLACE=127.0.0.1 + túnel).
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Las respuestas del agente llegan por SSE: sin búfer (cada fragmento
        # sale al instante) y con tiempo de sobra (una tarea del Generador
        # puede tardar minutos; el backend manda latidos cada 10 s).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Archivos con huella en el nombre: caché larga.
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Manifiesto de la PWA: nginx no conoce la extensión .webmanifest y lo
    # mandaba como application/octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Todo lo demás es la SPA: el enrutador de React decide la pantalla. El
    # index nunca se guarda en caché, o el navegador seguiría con una versión
    # vieja después de un despliegue.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache" always;
    }
}
