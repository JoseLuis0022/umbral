<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- theme-color = --bg de src/index.css. Debe coincidir con el fondo de la
         app para que no haya destello blanco al abrir en móvil. -->
    <meta name="theme-color" content="#f5f7fa" />
    <title>Umbral · Asistente de estudio con IA</title>
    <meta name="description" content="Pregúntale a tus clases: cada respuesta cita la clase, la diapositiva o el apunte de donde sale." />

    <!-- Vista previa al compartir el enlace (WhatsApp, LinkedIn, X, Slack…).
         Las redes exigen la URL ABSOLUTA de la imagen: __URL_PUBLICA__ la
         pone vite.config.ts con VITE_URL_PUBLICA al compilar. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Umbral" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:url" content="__URL_PUBLICA__/" />
    <meta property="og:title" content="Umbral · Asistente de estudio con IA" />
    <meta property="og:description" content="Pregúntale a tus clases: cada respuesta cita la clase, la diapositiva o el apunte de donde sale." />
    <meta property="og:image" content="__URL_PUBLICA__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Umbral: chat que responde citando la clase y la diapositiva" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Umbral · Asistente de estudio con IA" />
    <meta name="twitter:description" content="Pregúntale a tus clases: cada respuesta cita la clase, la diapositiva o el apunte de donde sale." />
    <meta name="twitter:image" content="__URL_PUBLICA__/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
