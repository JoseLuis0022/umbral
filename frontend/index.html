<!doctype html>
<html lang="es-MX" style="background: #f5f7fa">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA: se instala como app (ícono, pantalla propia, sin barra del navegador). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Umbral" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- theme-color = --bg de src/index.css. Debe coincidir con el fondo de la
         app para que no haya destello blanco al abrir en móvil. -->
    <meta name="theme-color" content="#f5f7fa" />
    <!-- seo:inicio
         Metadatos de cada página. scripts/prerender.mjs reemplaza este bloque
         al compilar: título, descripción, canonical, Open Graph, Twitter y
         JSON-LD de la landing y las legales (src/copy → seo), y noindex en el
         shell de la app (app.html). Lo de aquí solo se ve en `npm run dev`. -->
    <title>Umbral</title>
    <meta name="description" content="Pregúntale a tu agente de Claude: cada respuesta cita la fuente de donde sale." />
    <!-- seo:fin -->
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
