[project]
name = "umbral-backend"
version = "0.1.0"
description = "Umbral: FastAPI + Claude Agent SDK"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.178",
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.16",
    "pyjwt>=2.15",
    "argon2-cffi>=25.1",
    "httpx>=0.28",
    # Cifra la contraseña de aplicación de Gmail guardada en la base (correo.py).
    "cryptography>=46",
]

[project.optional-dependencies]
# Pruebas: `uv pip install -e ".[dev]"` y luego `pytest` desde backend/.
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
