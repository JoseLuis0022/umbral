<!doctype html>
<!--
  Miniatura al compartir (Open Graph / Twitter): 1200×630.
  Fuente de frontend/public/og.png. Se regenera con `node scripts/og/generar.mjs`.
  Sobria y de marca: el titular de la landing y la MacBook con el chat, sobre
  el lienzo claro de la app (--bg). Sin degradados de adorno; el texto a un
  tamaño que se lee en la miniatura de 500 px de LinkedIn o X.
-->
<html lang="es-MX">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Google Sans Variable';
    font-weight: 400 700;
    src: url(../../frontend/src/assets/fuentes/google-sans-latin-wght-normal.woff2) format('woff2-variations');
  }
  :root { --bg: #f5f7fa; --text-1: #161c27; --text-2: #535e70; --accent: #2f5fe4; --hairline: #e3e7ee; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  body { position: relative; font-family: 'Google Sans Variable', system-ui, sans-serif; color: var(--text-1); -webkit-font-smoothing: antialiased; }
  .texto { position: absolute; left: 72px; top: 64px; width: 500px; height: 502px; display: flex; flex-direction: column; }
  .marca { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
  .marca svg { width: 40px; height: 40px; }
  h1 { margin-top: 52px; font-size: 54px; line-height: 1.08; font-weight: 600; letter-spacing: -0.03em; text-wrap: balance; }
  .pie { margin-top: auto; display: flex; align-items: center; gap: 14px; font-size: 22px; color: var(--text-2); }
  .pie .punto { width: 5px; height: 5px; border-radius: 50%; background: #9aa3b2; }
  /* La Mac manda: entra desde la derecha y se corta abajo, como en la portada. */
  .mac { position: absolute; left: 596px; top: 92px; width: 780px; height: auto; }
</style>
</head>
<body>
  <div class="texto">
    <div class="marca">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 17h9V7h9" fill="none" stroke="#161c27" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="4.6" fill="none" stroke="#2f5fe4" stroke-width="1.2" opacity="0.38"/>
        <circle cx="4" cy="17" r="2.1" fill="#161c27"/>
        <circle cx="20" cy="7" r="2.1" fill="#161c27"/>
        <circle cx="12" cy="12" r="2.5" fill="#2f5fe4"/>
      </svg>
      Umbral
    </div>
    <h1>Tu agente de Claude, de la laptop a una app web para tu equipo.</h1>
    <div class="pie">
      <span>umbral.imperioon.com</span><span class="punto"></span><span>Código abierto, MIT</span>
    </div>
  </div>
  <img class="mac" src="../../frontend/public/landing/mac-chat.webp" alt="">
</body>
</html>
