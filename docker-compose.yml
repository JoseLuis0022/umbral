# Umbral en producción: `docker compose up -d` y listo.
#
#   web       nginx: sirve la app y pasa /api al backend (único puerto expuesto)
#   backend   FastAPI + Claude Agent SDK (solo accesible desde `web`)
#   respaldo  copia diaria de la base al volumen `respaldos` (sin cron del servidor)
#
# Configuración: copia .env.example a .env y llénalo. El material del agente
# se monta desde AGENTE_DIR (por defecto ./agente).

name: umbral

services:
  backend:
    build: ./backend
    image: umbral-backend:local
    restart: unless-stopped
    env_file: .env
    environment:
      AGENTE_CWD: /agente
      DB_RUTA: /datos/umbral.db
      CONFIG_CLAUDE: /datos/claude
    volumes:
      # Base de datos y sesiones del agente: sobreviven a reinicios y despliegues.
      - datos:/datos
      # La carpeta del agente (CLAUDE.md, material, skills). Escribible: el modo
      # Generador crea apuntes ahí. Debe pertenecer al UID 1000 del servidor.
      - ${AGENTE_DIR:-./agente}:/agente
    # Al desplegar, deja terminar las respuestas en curso antes de apagar.
    stop_grace_period: 45s
    expose:
      - "8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:-/}
        VITE_URL_PUBLICA: ${VITE_URL_PUBLICA:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # ENLACE=127.0.0.1 publica el puerto solo para esta máquina (detrás de
      # un túnel de Cloudflare en el mismo servidor). Ver .env.example.
      - "${ENLACE:-0.0.0.0}:${PUERTO:-8080}:80"

  # Respaldo diario de la base (app/respaldo.py) con la misma imagen del
  # backend. Copia manual: docker compose exec respaldo python -m app.respaldo --ahora
  # Sacarlos del servidor: docker compose cp respaldo:/respaldos ./respaldos
  respaldo:
    image: umbral-backend:local
    restart: unless-stopped
    command: ["python", "-m", "app.respaldo"]
    environment:
      DB_RUTA: /datos/umbral.db
      CARPETA_RESPALDOS: /respaldos
      CONSERVAR_RESPALDOS: ${CONSERVAR_RESPALDOS:-14}
      HORA_RESPALDO: ${HORA_RESPALDO:-10}
    volumes:
      - datos:/datos
      - respaldos:/respaldos
    depends_on:
      backend:
        condition: service_healthy
    # La imagen trae el healthcheck de la API; este servicio no la sirve.
    healthcheck:
      disable: true

volumes:
  datos:
  respaldos:
